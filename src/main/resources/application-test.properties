####################################################################################################
## Storage                                                                                        ##
####################################################################################################

spring.data.mongodb.host=localhost
spring.data.mongodb.port=27019
spring.data.mongodb.database=testch
spring.data.mongodb.username=cese
spring.data.mongodb.password=password

# https://www.baeldung.com/spring-boot-h2-database
spring.datasource.embedded-database-connection=h2
spring.datasource.url=jdbc:h2:mem:app4edi;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# set to true if you want to make sure that each context has a separate embedded database 
# false means same database is reused by the whole test suite regardless of the number of application contexts that you use
spring.datasource.generate-unique-name=false

spring.sql.init.mode=always
spring.sql.init.platform=h2
spring.sql.init.continue-on-error=false

# none, validate, update, create-drop
spring.jpa.hibernate.ddl-auto=create-drop
# populates the data (data.sql script) after the schema is generated by Hibernate
spring.jpa.defer-datasource-initialization=true

# embedded GUI console for browsing the contents of a database and running SQL queries (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
# to prevent trace output
spring.h2.console.settings.trace=false
spring.h2.console.path=/h2-console

####################################################################################################
## Log Level                                                                                        ##
####################################################################################################

private.key.file=${PRIVATE_KEY:classpath:server/keys/private_key.der}


logging.level.root=info
logging.level.pt.inesctec.ids.clearinghouse.service=debug
logging.level.pt.inesctec.ids.clearinghouse.controller=debug

logging.level.org.hibernate.SQL=debug
logging.level.org.springframework.transaction=trace
